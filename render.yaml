services:
  # ── Backend Web Service ──────────────────────────────────────────
  - type: web
    name: bus-tracking-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Render will ask you to type this manually
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure key
      - key: FRONTEND_URL
        fromService:
          name: bus-tracking-frontend
          type: web
          property: host

  # ── Frontend Static Site ─────────────────────────────────────────
  - type: web
    name: bus-tracking-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: bus-tracking-backend
          type: web
          property: host
